repos:
-   repo: https://github.com/psf/black
    rev: 22.6.0
    hooks:
    - id: black
      language_version: python3.13
-   repo: local
    hooks:
    -   id: pytest-cov
        name: pytest-cov
        entry: pytest tests
        language: system
        args:
            - "--cov=."
            - "--cov-report=term-missing"
            - "--cov-fail-under=50"
        types: [python]

[project]
name = "fantasy-manager"
version = "0.1.0"
description = "CLI Tool for managing fantasy hockey rosters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docopts>=0.6.1",
    "nhl-api-py>=2.18.0",
    "pydantic>=2.10.6",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "yahoo-fantasy-api>=2.11.0",
    "yahoo-oauth>=2.1.1",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "freezegun>=1.5.1",
    "ipdb>=0.13.13",
    "pyhamcrest>=2.1.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

